services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: syntera-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/syntera/syntera.db
      - key: QDRANT_URL
        sync: false          # set in Render dashboard
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false          # set in Render dashboard — secret
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_API_KEY
        sync: false          # defaults to LLM_API_KEY if left blank
      - key: WORK_DIR
        value: /tmp/syntera/work
      - key: ALLOW_CONFIG_INSPECT
        value: "false"
      - key: MAX_REPOSITORY_SIZE_BYTES
        value: "83886080"
      - key: CLONE_TIMEOUT_SECONDS
        value: "120"
      - key: PARSE_CONCURRENCY
        value: "2"
